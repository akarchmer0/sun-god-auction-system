name: Verify personal build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --check server.mjs
      - run: node --check electron/main.mjs
      - run: node --check relay/worker.mjs
      - run: pnpm exec wrangler deploy --dry-run --config relay/wrangler.toml
